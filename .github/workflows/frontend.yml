name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - "scripts/test_embed_nginx.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - "scripts/test_embed_nginx.py"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-image:
    name: Docker multi-stage image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Prepare version info
        id: version
        run: echo "commit_id=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          load: true
          tags: weknora-ui:ci
          build-args: VITE_FRONTEND_COMMIT=${{ steps.version.outputs.commit_id }}
          cache-from: |
            type=gha,scope=build-ui
            type=gha,scope=frontend-ci
          cache-to: type=gha,scope=frontend-ci,mode=max

      - name: Test embed and MCP proxy routes
        run: python3 scripts/test_embed_nginx.py weknora-ui:ci
