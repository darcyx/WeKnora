version: "2"
linters:
  enable:
    - lll           # 控制行宽
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    rules:
      # swag annotations and struct tags cannot wrap, so a parameter with its
      # enum list, a composed response type or a field's swag tags have to
      # stay on one line.
      - linters: [lll]
        source: '^\s*// @(Param|Success|Failure|x-)|(swaggertype|extensions):"'
      # comments are banned in the service layer (see cmd/nocomment), so
      # revive must not demand doc comments there.
      - linters: [revive]
        path: ^internal/application/service/
        text: 'exported|package-comments'
formatters:
  enable:
    - gofmt
    - gofumpt
